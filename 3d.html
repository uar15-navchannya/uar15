<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#10150D">
<title>UAR-15S · 3D (пробна версія)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap">
<style>
:root { --bg:#10150D; --surface:#1A2117; --surface-hi:#242C20; --line:#2E3829; --text:#F2F0EA; --muted:#9AA392; --orange:#FF6A13; --violet:#8B5CF6;
  --display:"Oswald","Arial Narrow",Impact,sans-serif; --body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color-scheme:dark; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 var(--body); -webkit-tap-highlight-color:transparent; }
[hidden] { display:none !important; }
.wrap { max-width:900px; margin:0 auto; padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:12px; }
h1 { margin:0; font:600 19px/1.2 var(--display); letter-spacing:1px; text-transform:uppercase; }
h1 small { font:500 12px/1 var(--display); letter-spacing:1.5px; color:var(--orange); margin-left:8px; }
.stage { position:relative; height:min(58svh,560px); min-height:300px; border-radius:16px; overflow:hidden; background:radial-gradient(ellipse at 50% 40%, #1f2a1b 0%, #10150D 75%); border:1px solid var(--line); touch-action:none; }
.stage canvas { display:block; width:100%; height:100%; }
.chip { position:absolute; left:10px; top:10px; padding:6px 12px; border-radius:20px; background:rgba(16,21,13,.85); border:1px solid var(--line); font:600 15px/1.2 var(--display); letter-spacing:.5px; }
.hint { position:absolute; right:10px; bottom:8px; font-size:12px; color:var(--muted); pointer-events:none; }
.tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.tab, .btn { min-height:50px; border:1.5px solid var(--line); border-radius:10px; background:transparent; color:var(--text); font:500 16px/1 var(--display); letter-spacing:1px; text-transform:uppercase; cursor:pointer; }
.tab[aria-pressed="true"] { background:var(--violet); border-color:var(--violet); color:#fff; font-weight:600; }
.btn.primary { background:var(--orange); border-color:var(--orange); color:#000; font-weight:600; }
.btn[disabled] { opacity:.35; }
.panel { display:flex; flex-direction:column; gap:10px; padding:12px; border-radius:14px; background:var(--surface); }
.row { display:flex; align-items:center; gap:12px; }
.row label { font-size:14px; color:var(--muted); flex:none; }
input[type=range] { flex:1; accent-color:var(--orange); height:32px; }
.check { display:flex; align-items:center; gap:8px; font-size:15px; }
.check input { width:20px; height:20px; accent-color:var(--violet); }
.stepn { font:600 13px/1 var(--display); letter-spacing:1.5px; color:var(--violet); text-transform:uppercase; }
.stept { font-size:16px; line-height:1.35; min-height:2.7em; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.note { font-size:12px; line-height:1.4; color:var(--muted); margin:0; }
:focus-visible { outline:3px solid var(--violet); outline-offset:2px; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div class="wrap">
  <h1>UAR-15S · 3D <small>пробна версія</small></h1>
  <div class="stage" id="stage">
    <div class="chip" id="chip" hidden></div>
    <div class="hint">крути · наближай · торкнись деталі</div>
  </div>
  <div class="tabs">
    <button class="tab" id="tab-view" aria-pressed="true">Огляд</button>
    <button class="tab" id="tab-steps" aria-pressed="false">Розбирання</button>
  </div>
  <div class="panel" id="panel-view">
    <div class="row"><label for="explode">Розкласти</label><input type="range" id="explode" min="0" max="100" value="0"></div>
    <label class="check"><input type="checkbox" id="xray"> Прозорий корпус — видно затвор, буфер і пружину</label>
  </div>
  <div class="panel" id="panel-steps" hidden>
    <div class="stepn" id="stepn"></div>
    <div class="stept" id="stept"></div>
    <div class="row2"><button class="btn" id="prev">Назад</button><button class="btn primary" id="next">Далі</button></div>
  </div>
  <p class="note">Схематична модель із простих форм: пропорції приблизні, дрібні деталі не показано. Порядок розбирання — за плакатом «Гвинтівка UAR-15. Порядок неповного розбирання гвинтівки» (varchdesign.com.ua).</p>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './vendor/OrbitControls.js';

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 1, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false; controls.minDistance = 30; controls.maxDistance = 320;
controls.target.set(2, 0, 0);
camera.position.set(2 + 35, 22, 100);
scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3324, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(30, 50, 60); scene.add(sun);
const rim = new THREE.DirectionalLight(0xffb070, 0.6); rim.position.set(-40, 10, -50); scene.add(rim);

// ── Матеріали ──
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.62, metalness: 0.25, ...o });
const TAN = 0x8f7650, BLACK = 0x23262a, STEEL = 0x8d9399, DARK = 0x3a3d42;

// ── Геометрія: вісь X — від приклада (−) до дула (+) ──
const box = (w, h, d, x, y, z = 0) => { const g = new THREE.BoxGeometry(w, h, d); g.translate(x, y, z); return g; };
const cylX = (r, len, x, y, z = 0, seg = 24) => { const g = new THREE.CylinderGeometry(r, r, len, seg); g.rotateZ(Math.PI / 2); g.translate(x, y, z); return g; };
const cylY = (r, len, x, y, z = 0) => { const g = new THREE.CylinderGeometry(r, r, len, 16); g.translate(x, y, z); return g; };
const cylZ = (r, len, x, y, z = 0) => { const g = new THREE.CylinderGeometry(r, r, len, 16); g.rotateX(Math.PI / 2); g.translate(x, y, z); return g; };
const extr = (pts, depth) => { const s = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1]))); const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false }); g.translate(0, 0, -depth / 2); return g; };
function helixX(x0, x1, r, turns, y) {
  class H extends THREE.Curve { getPoint(t) { const a = t * turns * Math.PI * 2; return new THREE.Vector3(x0 + (x1 - x0) * t, y + Math.cos(a) * r, Math.sin(a) * r); } }
  return new THREE.TubeGeometry(new H(), turns * 14, 0.14, 6, false);
}

const parts = {};
function part(id, name, geoms, mat, explode, shell = false) {
  const g = new THREE.Group();
  for (const geo of geoms) { const m = new THREE.Mesh(geo, mat); m.userData.part = id; g.add(m); }
  scene.add(g);
  parts[id] = { id, name, group: g, mat, explode: new THREE.Vector3(...explode), target: new THREE.Vector3(), shell };
}
const AX = 2.7; // вісь ствола

part('barrel', 'Ствол', [cylX(0.8, 27, 22.5, AX), cylX(1.15, 4, 38, AX, 0, 12), cylX(1.3, 1.6, 10, AX)], M(DARK, { metalness: 0.6 }), [18, 9, 0]);
part('handguard', 'Цівка', [cylX(2.35, 24, 21, AX, 0, 8), box(24, 0.5, 1.5, 21, AX + 2.3), box(5, 3.6, 2.2, 21, AX - 3.9)], M(TAN), [9, 17, 0], true);
part('upper', 'Рама верхня', [box(19, 3.4, 3.0, -0.5, AX), box(19, 0.5, 1.6, -0.5, AX + 1.95), box(3.2, 1.2, 0.5, 2, AX - 0.3, 1.7)], M(TAN), [0, 12, 0], true);
part('ch', 'Рукоятка перезаряджання', [box(14, 0.4, 1.0, -4, AX + 1.45), box(1.3, 0.9, 4.4, -11.3, AX + 1.45)], M(BLACK), [-9, 21, 0]);
part('carrier', 'Затворна рама', [cylX(1.05, 14, -1.5, AX), box(5, 0.8, 0.8, 0.5, AX + 1.05)], M(STEEL, { metalness: 0.75, roughness: 0.35 }), [-26, 8, 0]);
part('bolt', 'Затвор', [cylX(0.75, 4.5, 7.25, AX), cylX(0.95, 0.9, 9.3, AX, 0, 8)], M(0xb9bec4, { metalness: 0.8, roughness: 0.3 }), [-13, 8, 0]);
part('fpin', 'Ударник', [cylX(0.22, 12, -1, AX), cylX(0.42, 0.6, -7.2, AX)], M(0xd9dde2, { metalness: 0.85, roughness: 0.25 }), [-26, 4.5, 0]);
part('cam', 'Палець затвора', [cylY(0.38, 1.7, 4, AX + 0.85), box(0.9, 0.35, 0.9, 4, AX + 1.75)], M(0xd0b060, { metalness: 0.7 }), [-17, 13, 0]);
part('rpin', 'Шплінт фіксації ударника', [cylZ(0.16, 2.8, -6, AX), cylZ(0.3, 0.3, -6, AX, 1.5)], M(0xe2e5e9, { metalness: 0.8 }), [-28, 5, 5]);
part('lower', 'Рама нижня в зборі', [
  extr([[-10, 1.0], [8.5, 1.0], [8.5, -1.5], [6.6, -4.6], [1.5, -4.6], [1.5, -2.2], [-5, -2.2], [-6, -1.5], [-10, -1.5]], 2.8),
  cylX(1.5, 17.5, -18.5, 1.9), box(4.2, 0.25, 0.9, -0.6, -4.0), box(0.5, 1.6, 0.4, -1.2, -2.9),
], M(TAN), [0, 0, 0], true);
part('stock', 'Приклад', [extr([[-34, -5.2], [-34, 3.5], [-14.5, 3.5], [-14.5, 0.1], [-22, -0.6], [-30, -5.2]], 3.4)], M(BLACK), [-13, 0, 0], true);
part('grip', 'Пістолетне руків’я', [extr([[-8.6, -1.5], [-4.6, -1.5], [-6.6, -10.2], [-10.8, -10.2]], 2.6)], M(BLACK), [4, -9, 0]);
part('mag', 'Магазин', [extr([[2, -1.2], [6, -1.2], [7.3, -15], [3.1, -15.6]], 2.2)], M(BLACK, { roughness: 0.8 }), [5, -13, 0]);
part('buffer', 'Буфер', [cylX(1.0, 7, -13.5, 1.9), cylX(0.75, 1, -17.5, 1.9)], M(0xa0a6ac, { metalness: 0.7, roughness: 0.4 }), [0, -13, 0]);
part('spring', 'Зворотна пружина', [helixX(-26.5, -18, 0.85, 16, 1.9)], M(0xc3c8cd, { metalness: 0.8, roughness: 0.3 }), [0, -10, 0]);
part('sling', 'Антабка', [(() => { const g = new THREE.TorusGeometry(0.85, 0.16, 8, 20); g.translate(-10.6, -0.9, 1.7); return g; })()], M(DARK, { metalness: 0.6 }), [-3, -5, 3]);
part('rearpin', 'Задня вісь', [cylZ(0.36, 3.4, -8.6, 0.9)], M(0xd0d4d8, { metalness: 0.8 }), [0, 0, 7]);
part('frontpin', 'Передня вісь', [cylZ(0.36, 3.4, 7.6, 0.5)], M(0xd0d4d8, { metalness: 0.8 }), [0, 0, 7]);

// ── Кроки неповного розбирання (як на сторінці навчання) ──
const UPPER = ['upper', 'handguard', 'barrel', 'ch', 'carrier', 'bolt', 'fpin', 'cam', 'rpin'];
const BCG = ['carrier', 'bolt', 'fpin', 'cam', 'rpin'];
const STEPS = [
  ['Натиснути кнопку фіксатора магазина й вийняти магазин.', [[['mag'], 3, -15, 0]]],
  ['Важелем перезаряджання відтягнути затворну раму назад і оглянути патронник.', [[['ch', ...BCG], -6, 0, 0]]],
  ['Відпустити важіль — затворна рама йде вперед. Спустити курок, натиснувши спусковий гачок.', [[['ch', ...BCG], 6, 0, 0]]],
  ['Витиснути задню вісь.', [[['rearpin'], 0, 0, 2.4]]],
  ['Витиснути передню вісь.', [[['frontpin'], 0, 0, 2.4]]],
  ['Роз’єднати верхню й нижню рами.', [[UPPER, 0, 12, 0]]],
  ['Відтягнути важіль перезаряджання назад.', [[['ch', ...BCG], -6, 0, 0]]],
  ['Витягнути затворну раму в зборі із затвором.', [[BCG, -20, -5, 0]]],
  ['Витягнути важіль перезаряджання з направляючих пазів.', [[['ch'], -14, 5, 0]]],
  ['Витягнути шплінт фіксації ударника.', [[['rpin'], 0, 0, 5]]],
  ['Повернути затворну раму затвором догори — ударник випадає.', [[['fpin'], -9, -3, 0]]],
  ['Зсунути затвор до упору, натиснувши на дзеркало затвора.', [[['bolt'], -1, 0, 0]]],
  ['Провернути головку пальця затвора на 90° і витягти палець.', [[['cam'], 0, 4.5, 0]]],
  ['Витягнути затвор із затворної рами.', [[['bolt'], 9, 0, 0]]],
  ['Втиснути буфер віддачі в трубу приклада й натиснути фіксатор буфера донизу.', [[['buffer', 'spring'], -1, 0, 0]]],
  ['Притримуючи буфер, витягнути його з труби приклада разом зі зворотною пружиною.', [[['buffer'], 17, 5, 0], [['spring'], 17, 8.5, 0]]],
];

// ── Стан ──
let mode = 'view', explode = 0, step = 0, picked = null;
function setTargets() {
  for (const p of Object.values(parts)) p.target.set(0, 0, 0);
  if (mode === 'view') { for (const p of Object.values(parts)) p.target.copy(p.explode).multiplyScalar(explode); }
  else for (let i = 0; i < step; i++) for (const [ids, x, y, z] of STEPS[i][1]) for (const id of ids) parts[id].target.add(new THREE.Vector3(x, y, z));
}
function setXray(on) {
  for (const p of Object.values(parts)) if (p.shell) { p.mat.transparent = on; p.mat.opacity = on ? 0.28 : 1; p.mat.depthWrite = !on; p.mat.needsUpdate = true; }
}
const $ = id => document.getElementById(id);
function paint() {
  $('tab-view').setAttribute('aria-pressed', String(mode === 'view'));
  $('tab-steps').setAttribute('aria-pressed', String(mode === 'steps'));
  $('panel-view').hidden = mode !== 'view'; $('panel-steps').hidden = mode !== 'steps';
  if (mode === 'steps') {
    $('stepn').textContent = step === 0 ? 'Зібрана гвинтівка' : `Крок ${step} з ${STEPS.length}`;
    $('stept').textContent = step === 0 ? 'Натисни «Далі», щоб почати неповне розбирання. «Назад» — збирає у зворотному порядку.' : STEPS[step - 1][0];
    $('prev').disabled = step === 0; $('next').disabled = step === STEPS.length;
    setXray(step >= 7 || $('xray').checked);
  } else setXray($('xray').checked);
  setTargets();
}
$('tab-view').onclick = () => { mode = 'view'; paint(); };
$('tab-steps').onclick = () => { mode = 'steps'; paint(); };
$('explode').oninput = e => { explode = e.target.value / 100; setTargets(); };
$('xray').onchange = paint;
$('prev').onclick = () => { if (step > 0) { step--; paint(); } };
$('next').onclick = () => { if (step < STEPS.length) { step++; paint(); } };

// ── Дотик до деталі: назва й підсвітка ──
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(scene.children, true).filter(h => h.object.userData.part);
  // крізь прозорий корпус — спершу внутрішні деталі
  const hit = hits.find(h => !(parts[h.object.userData.part].shell && parts[h.object.userData.part].mat.transparent)) || hits[0];
  if (picked) parts[picked].mat.emissive.setHex(0x000000);
  picked = hit ? hit.object.userData.part : null;
  const chip = $('chip');
  if (picked) { parts[picked].mat.emissive.setHex(0x5a2a00); chip.textContent = parts[picked].name; chip.hidden = false; } else chip.hidden = true;
});

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const half = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(42 / (half * camera.aspect), 26 / half);   // вмістити ~84 по ширині й ~52 по висоті
  const dir = camera.position.clone().sub(controls.target);
  if (dir.lengthSq() < 1) dir.set(0.35, 0.22, 1);
  camera.position.copy(controls.target).add(dir.normalize().multiplyScalar(dist));
}
new ResizeObserver(resize).observe(stage);
resize(); paint();

renderer.setAnimationLoop(() => {
  for (const p of Object.values(parts)) p.group.position.lerp(p.target, 0.14);
  controls.update();
  renderer.render(scene, camera);
});
window.__3d = { parts, STEPS, get step() { return step; } };
</script>
</body>
</html>
