function uarNight(d) { d = d || new Date(); const y0 = new Date(d.getFullYear(), 0, 1), doy = (d - y0) / 864e5, dst = d.getTimezoneOffset() < Math.max(y0.getTimezoneOffset(), new Date(d.getFullYear(), 6, 1).getTimezoneOffset()) ? 1 : 0; const len = 12 + 4.1 * Math.sin(2 * Math.PI * (doy - 80) / 365), noon = 12.1 + dst, h = d.getHours() + d.getMinutes() / 60; return h < noon - len / 2 - 0.3 || h > noon + len / 2 + 0.3; }
let t = null; try { t = localStorage.getItem('uar15_theme'); } catch (e) { /* без сховища */ }
document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : (uarNight() ? 'dark' : 'light');
</script>

<style>
/* Layout: одна колонка до 720px, липка шапка; екрани перемикаються за #хешем, як розділ UAR-15S у DigDeep.
   Кольори — DigDeep: темне оливкове тло, помаранчева дія, фіолетовий акцент модуля «Мозок». */
:root {
  --bg: #10150D;
  --surface: #1A2117;
  --surface-hi: #242C20;
  --line: #2E3829;
  --text: #F2F0EA;
  --muted: #9AA392;
  --orange: #FF6A13;
  --on-orange: #000000;
  --violet: #8B5CF6;
  --good: #34D399;
  --bad: #D7263D;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  /* Тло зображень і плашки на них — однакові в обох темах, бо належать самим зображенням. */
  --mat-scheme: #C6C0B1;
  --mat-photo: #EDEDED;
  --chip-bg: rgba(16, 21, 13, .82);
  --chip-fg: #F2F0EA;
  --display: "Oswald", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --hl: color-mix(in srgb, var(--violet) 30%, transparent);
    --bg: #EEF0E8; --surface: #FFFFFF; --surface-hi: #E4E7DB; --line: #C9CFBD;
    --text: #161C12; --muted: #555F4E; --orange: #E85A08; --on-orange: #000000;
    --violet: #6A3BDB; --good: #0B8457; --bad: #C21F33; --shadow: 0 10px 30px rgba(22, 28, 18, .18);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
    --hl: color-mix(in srgb, var(--violet) 30%, transparent);
  --bg: #EEF0E8; --surface: #FFFFFF; --surface-hi: #E4E7DB; --line: #C9CFBD;
  --text: #161C12; --muted: #555F4E; --orange: #E85A08; --on-orange: #000000;
  --violet: #6A3BDB; --good: #0B8457; --bad: #C21F33; --shadow: 0 10px 30px rgba(22, 28, 18, .18);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #10150D; --surface: #1A2117; --surface-hi: #242C20; --line: #2E3829;
  --text: #F2F0EA; --muted: #9AA392; --orange: #FF6A13; --on-orange: #000000;
  --violet: #8B5CF6; --good: #34D399; --bad: #D7263D; --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

html { -webkit-text-size-adjust: 100%; }
html.lock, html.lock body { overflow: hidden; }
body { background: var(--bg); color: var(--text); font: 16px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ── Шапка ── */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--bg); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-in { max-width: 720px; margin: 0 auto; min-height: 56px; display: flex; align-items: center; gap: 4px; }
.bar h1 { flex: 1; min-width: 0; margin: 0; font: 600 19px/1.2 var(--display); letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 12px; background: transparent; cursor: pointer; color: var(--text); flex: none; }
.icon-btn:hover { background: var(--surface); }
.icon-btn[aria-pressed="false"] { color: var(--muted); }
#back { margin-left: -10px; }

main {
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 120px;
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.wrap > * { min-width: 0; }

/* ── Типографіка ── */
.h { margin: 6px 0 0; font: 600 16px/1.25 var(--display); letter-spacing: 2px; text-transform: uppercase; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.src { margin: 0; font-size: 12px; line-height: 1.4; color: var(--muted); }
.srcs { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
p { margin: 0; }

/* ── Головна ── */
.hero { display: flex; flex-direction: column; gap: 10px; }
.hero-img { margin: 0; padding: 14px 10px 10px; border-radius: 14px; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #56614c 0%, #2c3527 58%, #182015 100%); }
.hero-img img { display: block; width: 100%; height: auto; max-height: 52svh; object-fit: contain; filter: drop-shadow(0 10px 12px rgba(0,0,0,.45)); }
.eyebrow { font: 500 13px/1.2 var(--display); letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.hero h2 { margin: 2px 0 0; font: 700 clamp(40px, 12vw, 64px)/1 var(--display); letter-spacing: 1px; }
.prog { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.prog span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { height: 6px; margin-top: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: var(--p); background: var(--good); border-radius: 3px; transition: width .4s ease; }
.coach { display: flex; gap: 14px; align-items: center; padding: 12px 14px 12px 12px; border-radius: 16px; background: var(--surface); }
.coach video { display: block; width: 76px; height: 76px; object-fit: cover; border-radius: 50%; border: 2px solid var(--orange); flex: none; background: #10150D; box-shadow: 0 0 0 4px var(--surface-hi); }
@media (min-width: 600px) { .coach video { width: 88px; height: 88px; } .coach p { font-size: 15px; } }
.who { font: 600 12px/1.1 var(--display); letter-spacing: 1.5px; text-transform: uppercase; color: var(--orange); }
.coach p { font-size: 14px; line-height: 1.4; margin-top: 3px; }

/* ── Ілюстрації до правил безпечного поводження ── */
.sp { display:block; width:100%; height:auto; margin:-2px 0 12px; border-radius:10px; background:var(--sp-bg); }
:root { --sp-bg:#232b1f; --sp-gun:#0f120d; --sp-tan:#b39a6e; --sp-ink:#dfe3d6; --sp-dim:#7f8a76; }
:root[data-theme="light"] { --sp-bg:#e3e7d8; --sp-gun:#22261f; --sp-tan:#a88b5a; --sp-ink:#1d2419; --sp-dim:#6b7562; }
.sp text { font:600 11px var(--display); letter-spacing:.8px; fill:var(--sp-ink); }
.sp .ok { fill:var(--good); } .sp .no { fill:var(--bad); } .sp .okS { stroke:var(--good); } .sp .noS { stroke:var(--bad); }
.sp .pulse { animation:sp-pulse 1.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
@keyframes sp-pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.35; transform:scale(1.35); } }
.sp .aim { transform-origin:53px 66px; animation:sp-aim 6s ease-in-out infinite; }
@keyframes sp-aim { 0%,22% { transform:rotate(0deg); } 40%,88% { transform:rotate(32deg); } 100% { transform:rotate(0deg); } }
.sp .A1 { animation:sp-a1 6s step-end infinite; } .sp .A2 { animation:sp-a2 6s step-end infinite; }
@keyframes sp-a1 { 0% { opacity:1; } 38% { opacity:0; } 92% { opacity:1; } }
@keyframes sp-a2 { 0% { opacity:0; } 38% { opacity:1; } 92% { opacity:0; } }
.sp .walk { animation:sp-walk 6s ease-in-out infinite; }
@keyframes sp-walk { 0%,25% { transform:translateX(0); opacity:1; } 45%,85% { transform:translateX(70px); opacity:0; } 100% { transform:translateX(0); opacity:1; } }
.sp .fing { transform-origin:84.8px 65.6px; animation:sp-fing 6s ease-in-out infinite; }
@keyframes sp-fing { 0%,22% { transform:rotate(14deg); } 40%,88% { transform:rotate(0deg); } 100% { transform:rotate(14deg); } }
.sp .ck { opacity:0; animation:sp-ck 6s ease-out infinite; }
.sp .ck.c2 { animation-delay:.9s; } .sp .ck.c3 { animation-delay:1.8s; }
@keyframes sp-ck { 0%,10% { opacity:0; transform:scale(.4); } 20%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; } }
.sp .ck { transform-box:fill-box; transform-origin:center; }
@media (prefers-reduced-motion: reduce) {
  .sp .aim { transform:rotate(32deg); } .sp .fing { transform:none; } .sp .A1, .sp .walk { opacity:0; } .sp .A2, .sp .ck { opacity:1; transform:none; }
}

.sp text.sm { font-size:9px; letter-spacing:.5px; }
.sp .sq { opacity:.25; animation:sp-sq 6s ease-in-out infinite; } .sp .sq.q2 { animation-delay:1.3s; } .sp .sq.q3 { animation-delay:2.6s; }
@keyframes sp-sq { 0% { opacity:.25; } 8%,70% { opacity:1; } 85%,100% { opacity:.25; } }
.sp .late { opacity:.22; animation:sp-late 6s ease-in-out infinite; }
@keyframes sp-late { 0%,42% { opacity:.22; } 52%,92% { opacity:1; } 100% { opacity:.22; } }
.sp .run { animation:sp-run 3s ease-in infinite; }
@keyframes sp-run { 0% { transform:translateX(0); opacity:1; } 80% { transform:translateX(46px); opacity:1; } 100% { transform:translateX(52px); opacity:0; } }
.sp .push { animation:sp-push 1.8s ease-in-out infinite; }
@keyframes sp-push { 0%,100% { transform:translateX(0); } 50% { transform:translateX(-9px); } }
.sp .up { animation:sp-up 6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
@keyframes sp-up { 0%,28% { opacity:0; transform:scale(.4); } 34%,46% { opacity:1; transform:scale(1.2); } 56%,100% { opacity:0; transform:scale(.4); } }
@media (prefers-reduced-motion: reduce) { .sp .sq, .sp .late { opacity:1; } .sp .run, .sp .push { transform:none; } .sp .up { opacity:1; transform:none; } }

:root { --sp-ground:#1b2117; --sp-paper:#2c3527; }
:root[data-theme="light"] { --sp-ground:#d0d6c0; --sp-paper:#f4f5ee; }
.sp .early { animation:sp-early 6s ease-in-out infinite; }
@keyframes sp-early { 0%,42% { opacity:1; } 52%,92% { opacity:0; } 100% { opacity:1; } }
@media (prefers-reduced-motion: reduce) { .sp .early { opacity:0; } }

.art.law-v { position:relative; padding-bottom:60px; transition:box-shadow .2s, border-color .2s; }
.art.law-v > .play { position:absolute; right:12px; bottom:10px; }
.art.law-v.playing { border-color:var(--orange); box-shadow:0 0 0 2px color-mix(in srgb, var(--orange) 35%, transparent); }

.codex { padding:18px 16px 8px; border-radius:16px; background:#2b3128; color:#f2f0ea; }
.codex h2 { margin:0 0 10px; font:700 30px/1 var(--display); letter-spacing:1px; text-transform:uppercase; color:#e4e1d6; }
.codex h2 span { display:block; margin-top:4px; font-size:22px; line-height:1.1; color:#f0a92e; }
.codex ol { list-style:none; margin:0; padding:0; }
.codex li { display:grid; grid-template-columns:34px 1fr; gap:10px; align-items:center; padding:10px 0; border-bottom:2px solid #f0a92e; }
.codex li b { font:700 38px/1 var(--display); color:#f0a92e; text-align:center; }
.codex li span { font:500 16px/1.3 var(--display); letter-spacing:.2px; }

.codex li.playing { background:rgba(240,169,46,.12); }
.codex li .play { grid-column:3; background:transparent; color:#f2f0ea; border-color:#5b6352; }
.codex li:has(.play) { grid-template-columns:34px 1fr 44px; }
.codex li .sp { grid-column:1 / -1; margin:4px 0 2px; }
.sp .sweep { transform-origin:160px 118px; animation:sp-sweep 6s ease-in-out infinite; }
@keyframes sp-sweep { 0%,8% { transform:rotate(0deg); } 25% { transform:rotate(-70deg); } 40% { transform:rotate(70deg); } 52%,62% { transform:rotate(112deg); } 80%,100% { transform:rotate(0deg); } }
.sp .B1 { animation:sp-b1 6s step-end infinite; } .sp .B2 { animation:sp-b2 6s step-end infinite; }
@keyframes sp-b1 { 0% { opacity:1; } 46% { opacity:0; } 68% { opacity:1; } }
@keyframes sp-b2 { 0% { opacity:0; } 46% { opacity:1; } 68% { opacity:0; } }
@media (prefers-reduced-motion: reduce) { .sp .B2 { opacity:0; } .sp .B1 { opacity:1; } }
@media (prefers-reduced-motion: reduce) { .sp .sweep { transform:none; } }
.art-h { margin:10px 0 -4px; font:600 17px/1.2 var(--display); letter-spacing:2px; text-transform:uppercase; color:var(--violet); }
.law { display:flex; flex-direction:column; gap:12px; }
.art { padding:14px; border-radius:14px; background:var(--surface); border:1px solid var(--line); }
.art h3 { margin:0 0 8px; font:600 15px/1.25 var(--display); letter-spacing:1.5px; text-transform:uppercase; color:var(--violet); }
.art p { margin:0 0 8px; line-height:1.5; }
.art p:last-child, .art ul:last-child { margin-bottom:0; }
.art ul { margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px; line-height:1.5; }
.art mark { color:inherit; font-weight:600; padding:0 2px; margin:0 -2px; border-radius:3px; background:linear-gradient(to top, var(--hl, color-mix(in srgb, var(--violet) 55%, transparent)) 0 42%, transparent 42%); -webkit-box-decoration-break:clone; box-decoration-break:clone; }
.art .cut { color:var(--muted); font-size:13px; }
.upd { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 60; min-height: 52px; border: 0; border-radius: 14px; background: var(--violet); color: #fff; font: 600 15px/1.2 var(--display); letter-spacing: .5px; box-shadow: 0 6px 20px rgba(0,0,0,.35); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 14px; text-align: center; }
.upd span { font: 500 12px/1.2 var(--display); opacity: .8; }
.upd.done { background: var(--surface); color: var(--text); border: 1.5px solid var(--violet); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.tile {
  display: flex; align-items: center; gap: 12px; min-height: 66px; padding: 10px 12px 10px 14px; text-align: left;
  background: var(--surface); border: 1px solid transparent; border-radius: 14px; cursor: pointer; transition: border-color .15s, transform .1s;
}
.tile:hover { border-color: var(--line); }
.tile:active { transform: scale(.985); }
.tile > svg:first-child { color: var(--violet); }
.tile .t { flex: 1; min-width: 0; }
.tile b { display: block; font: 600 16px/1.2 var(--display); letter-spacing: .6px; text-transform: uppercase; }
.tile small { display: block; margin-top: 2px; font-size: 13px; line-height: 1.3; color: var(--muted); }
.tile .chev { color: var(--muted); }
.tile[disabled] { cursor: default; }
.tile[disabled]:active { transform: none; }
.tile[disabled] > svg:first-child { color: var(--line); }
.tile[disabled] b { color: var(--muted); }
.tile .badge { min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--orange); color: var(--on-orange); font: 600 13px/24px var(--display); text-align: center; }

/* ── Кнопки ── */
.btn {
  width: 100%; min-height: 56px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1.5px solid var(--line); border-radius: 10px; background: transparent; color: var(--text); cursor: pointer;
  font: 500 18px/1 var(--display); letter-spacing: 1px; text-transform: uppercase;
}
.btn.primary { background: var(--orange); border-color: var(--orange); color: var(--on-orange); font-weight: 600; }
.btn[disabled] { opacity: .38; cursor: default; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── Зображення, що збільшуються ── */
.zimg { position: relative; display: block; width: 100%; padding: 0; border: 0; border-radius: 14px; overflow: hidden; background: var(--mat-scheme); cursor: zoom-in; }
.zimg.photo { background: var(--mat-photo); }
.zimg img { display: block; width: 100%; height: auto; object-fit: contain; }
.zimg.q img { height: clamp(200px, 40svh, 340px); }
.zimg.mini img { height: clamp(140px, 22svh, 200px); }
.zimg.thumb img { height: 120px; }
.zbadge { position: absolute; right: 8px; bottom: 8px; display: flex; align-items: center; gap: 4px; padding: 5px 10px 5px 7px; border-radius: 20px; background: var(--chip-bg); color: var(--chip-fg); font-size: 13px; }
.zbadge svg.i { width: 18px; height: 18px; }

/* ── Картки ТТХ ── */
.card {
  width: 100%; min-height: min(56svh, 460px); padding: 26px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 18px; text-align: center; cursor: pointer; touch-action: pan-y; user-select: none;
  transition: border-color .2s;
}
.card.open { border-color: var(--violet); }
.card.in-r { animation: in-r .2s ease-out; }
.card.in-l { animation: in-l .2s ease-out; }
@keyframes in-r { from { transform: translateX(40%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes in-l { from { transform: translateX(-40%); opacity: 0; } to { transform: none; opacity: 1; } }
.card .q { font: 600 clamp(22px, 6.4vw, 30px)/1.2 var(--display); text-wrap: balance; }
.card .a { font: 700 clamp(30px, 9.5vw, 46px)/1.1 var(--display); color: var(--violet); font-variant-numeric: tabular-nums; animation: pop .22s ease-out; }
.card .note { font-size: 14px; color: var(--muted); max-width: 32ch; }
.dots { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--violet); }
.dots i.seen { background: var(--muted); }

/* ── Таблиця ── */
.ttx { margin: 0; display: flex; flex-direction: column; }
.ttx div { padding: 11px 0; border-bottom: 1px solid var(--line); }
.ttx dt { font-size: 14px; color: var(--muted); }
.ttx dd { margin: 2px 0 0; font: 600 21px/1.25 var(--display); font-variant-numeric: tabular-nums; }
.ttx dd small { display: block; font: 400 12px/1.35 var(--body); color: var(--muted); margin-top: 2px; }

/* ── Будова ── */
.seg { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }

const store = {

  set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* немає сховища — прогрес живе до закриття сторінки */ } },

const K_CARDS = 'uar15_v1', K_BEST = 'uar15_order_best_v2_', K_VOICE = 'uar15_web_voice';

function loadCards() {
  try {
    const raw = JSON.parse(store.get(K_CARDS) || 'null');
    if (raw && typeof raw === 'object') {
      const m = {};
      for (const [k, v] of Object.entries(raw)) if (v && Number.isInteger(v.b) && typeof v.d === 'string') m[k] = { b: v.b, d: v.d };
      return m;
    }
  } catch (e) { /* пошкоджені дані — починаємо з нуля */ }
  return memCards ? { ...memCards } : {};
}
function saveCards(m) { memCards = { ...m }; store.set(K_CARDS, JSON.stringify(m)); keepData(); }
const memBest = {};
function getBest(key) { const v = parseInt(store.get(K_BEST + key), 10); return Number.isFinite(v) ? v : (memBest[key] ?? null); }
function setBest(key, sec) { const old = getBest(key); if (old == null || sec < old) { memBest[key] = sec; store.set(K_BEST + key, String(sec)); keepData(); } }

// ═════════ Логіка повтору: 1, 3, 7 днів ═════════
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const plusDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const ITEMS = [...FACTS.map(f => 'f:' + f.id), ...ON_DIAGRAM.map(n => 'p:' + n)];

function grade(m, item, ok, now) {
  const c = m[item] || { b: 0, d: dayKey(now) };
  if (ok) { c.b = Math.min(c.b + 1, 3); c.d = dayKey(plusDays(now, [1, 3, 7][c.b - 1])); }
  else { c.b = 0; c.d = dayKey(plusDays(now, 1)); }
  m[item] = c;
}
function dueItems(m, now) { const t = dayKey(now); return ITEMS.filter(i => m[i] && m[i].d <= t); }
function progress(m, prefix) {
  const it = ITEMS.filter(i => i.startsWith(prefix));
  return Math.round(it.reduce((a, i) => a + (m[i] ? m[i].b : 0), 0) / (it.length * 3) * 100);
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pickItems(m, now, dueOnly) {
  const due = shuffle(dueItems(m, now));
  if (dueOnly) return due.slice(0, 10);
  const fresh = shuffle(ITEMS.filter(i => !m[i]));
  const rest = shuffle(ITEMS.filter(i => !due.includes(i) && !fresh.includes(i)));
  return [...due, ...fresh, ...rest].slice(0, 10);
}
function question(item) {
  if (item.startsWith('f:')) {
    const f = FACTS.find(x => 'f:' + x.id === item);
    const opts = shuffle([f.a, ...f.w]);
    return { item, img: false, prompt: f.q, options: opts, answer: opts.indexOf(f.a), note: f.note || null };
  }
  const n = parseInt(item.slice(2), 10), name = PARTS[n];
  if (Math.random() < 0.5) {
    const others = shuffle(Object.keys(PARTS).map(Number).filter(k => k !== n).map(k => PARTS[k]));
    const opts = shuffle([name, ...others.slice(0, 3)]);
    return { item, img: true, prompt: `Що на моделі під номером ${n}?`, options: opts, answer: opts.indexOf(name), note: null };
  }
  const others = shuffle(ON_DIAGRAM.filter(x => x !== n));
  const opts = shuffle([String(n), ...others.slice(0, 3).map(String)]);
  return { item, img: true, prompt: `Під яким номером на моделі «${name.toLowerCase()}»?`, options: opts, answer: opts.indexOf(String(n)), note: null };
}

// Звукові ефекти з DigDeep (гучність — як у додатку). Web Audio: без затримки й накладання.
const SFX = { click: 0.7, whoosh: 0.2, rep: 1.0, miss: 0.7, goal: 1.0 };
const sfxBuf = {};
let actx = null;
function sfxInit() {
  if (actx) { if (actx.state === 'suspended') actx.resume().catch(() => {}); return; }
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    actx = new Ctx();
    for (const n of Object.keys(SFX)) {
      fetch(`sfx/${n}.mp3`).then(r => r.arrayBuffer())
        .then(buf => new Promise((res, rej) => actx.decodeAudioData(buf, res, rej)))
        .then(decoded => { sfxBuf[n] = decoded; }).catch(() => {});
    }
  } catch (e) { actx = null; }
}
function sfx(name) {
  if (!voiceOn) return;
  try {
    sfxInit();
    const buf = sfxBuf[name];
    if (!actx || !buf) return;
    const src = actx.createBufferSource(), gain = actx.createGain();
    src.buffer = buf; gain.gain.value = SFX[name];
    src.connect(gain); gain.connect(actx.destination);
    src.start();
  } catch (e) { /* без звуку — не критично */ }
}
// Перший дотик розблоковує звук (iPhone дозволяє Web Audio лише після дії людини).

const C = { i: 0, open: new Set(), seen: new Set() };
function cards() {
  const f = FACTS[C.i], shown = C.open.has(C.i), last = C.i === FACTS.length - 1;
  C.seen.add(C.i);
  setBar(`ТТХ · ${C.i + 1} / ${FACTS.length}`);
  app.innerHTML = `
    <button class="card${shown ? ' open' : ''}" id="card" data-act="flip" aria-live="polite">
      <span class="q">${esc(f.q)}</span>
      ${shown ? `<span class="a">${esc(f.a)}</span>${f.note ? `<span class="note">${esc(f.note)}</span>` : ''}`
        : '<span class="muted small">Торкнись, щоб побачити відповідь</span>'}
    </button>
    <div class="dots" aria-hidden="true">${FACTS.map((_, k) => `<i class="${k === C.i ? 'on' : C.seen.has(k) ? 'seen' : ''}"></i>`).join('')}</div>
    <div class="row2">
      <button class="btn" data-act="card-prev"${C.i === 0 ? ' disabled' : ''}>Назад</button>
      <button class="btn primary" data-act="${last ? 'go' : 'card-next'}" data-to="">${last ? 'Готово' : 'Далі'}</button>
    </div>
    <p class="src">Свайп вліво/вправо або стрілки на клавіатурі. Джерело: ${esc(SRC_TTX)}.</p>`;
  bindSwipe($('card'));
}
function flipCard() { if (C.open.has(C.i)) C.open.delete(C.i); else { C.open.add(C.i); sfx('click'); } cards(); $('card').focus({ preventScroll: true }); }
function cardGo(d) { const n = Math.min(FACTS.length - 1, Math.max(0, C.i + d)); if (n !== C.i) { C.i = n; sfx('whoosh'); cards(); } }
let swiped = false;
// Картка їде за пальцем; відпустив після 40 px (або швидкий змах) — наступна/попередня
let slideFrom = 0;
function bindSwipe(el) {
  let x0 = null, y0 = 0, t0 = 0, dx = 0, dy = 0, horiz = null, pid = null;
  if (slideFrom) { el.classList.add(slideFrom > 0 ? 'in-r' : 'in-l'); slideFrom = 0; }
  const reset = () => { x0 = null; horiz = null; el.style.transition = 'transform .18s ease-out'; el.style.transform = ''; };
  el.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; t0 = performance.now(); dx = 0; dy = 0; horiz = null; pid = e.pointerId; el.style.transition = 'none'; });
  el.addEventListener('pointermove', e => {
    if (x0 == null || e.pointerId !== pid) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    if (horiz == null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) { horiz = Math.abs(dx) > Math.abs(dy); if (horiz) try { el.setPointerCapture(pid); } catch (err) { /* без захоплення */ } }
    if (horiz) { const edge = (dx > 0 && C.i === 0) || (dx < 0 && C.i === FACTS.length - 1); el.style.transform = `translateX(${edge ? dx * 0.25 : dx}px) rotate(${dx / 60}deg)`; }
  });
  el.addEventListener('pointerup', e => {
    if (x0 == null) return;
    const v = Math.abs(dx) / Math.max(1, performance.now() - t0), go = horiz && (Math.abs(dx) > 40 || (Math.abs(dx) > 20 && v > 0.4));
    // Тап обробляємо самі: браузер інколи не дає click, якщо палець трохи зсунувся
    if (Math.hypot(dx, dy) < 12) { x0 = null; el.style.transform = ''; swiped = true; setTimeout(() => { swiped = false; }, 400); flipCard(); return; }
    if (!horiz) { reset(); return; }
    swiped = true; setTimeout(() => { swiped = false; }, 400);
    const d = dx < 0 ? 1 : -1, n = C.i + d;
    if (go && n >= 0 && n < FACTS.length) { slideFrom = d; cardGo(d); return; }
    reset();
  });
  el.addEventListener('pointercancel', reset);
}

let Q = null;
function quiz(review) {
  const m = loadCards();
  const items = pickItems(m, new Date(), review);
  Q = { review, m, qs: items.map(question), i: 0, chosen: null, ok: [], done: false };
  renderQuiz();
}
function renderQuiz(keepScroll) {
  if (!Q.qs.length) {
    setBar('Повтор');
    app.innerHTML = `<div class="empty"><p class="muted">Повторювати поки нічого.</p><button class="btn" data-act="go" data-to="">До розділу</button></div>`;
    return;
  }
  if (Q.done) return renderResults();
  const q = Q.qs[Q.i], answered = Q.chosen != null, last = Q.i === Q.qs.length - 1;
  setBar(`${Q.review ? 'Повтор' : 'Тест'} · ${Q.i + 1} / ${Q.qs.length}`);
  const cls = k => !answered ? '' : k === q.answer ? ' right' : k === Q.chosen ? ' wrong' : '';
  const mark = k => !answered ? '' : k === q.answer ? '<span class="mk" aria-label="правильно">✓</span>' : k === Q.chosen ? '<span class="mk" aria-label="помилка">✗</span>' : '';
  const body = `
    <div><h2 class="prompt">${esc(q.prompt)}</h2>${q.note && answered ? `<p class="muted small" style="margin-top:4px">${esc(q.note)}</p>` : ''}</div>
    <div class="opts">${q.options.map((o, k) => `<button class="opt${cls(k)}" data-act="opt" data-k="${k}"${answered ? ' aria-disabled="true"' : ''}><span>${esc(o)}</span>${mark(k)}</button>`).join('')}</div>
    ${answered ? `<button class="btn primary" id="qnext" data-act="quiz-next">${last ? 'Підсумок' : 'Далі'}</button>` : ''}`;
  // Модель лишається на місці між питаннями про будову — не перезавантажується
  if (q.img && $('qbody') && $('m3d')) $('qbody').innerHTML = body;
  else app.innerHTML = `${q.img ? m3d('labels', 'view') : ''}<div class="col" id="qbody">${body}</div>`;
  if (answered) { const b = $('qnext'); b.focus({ preventScroll: true }); b.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  if (!keepScroll) window.scrollTo(0, 0);
}
function answer(k) {
  if (!Q || Q.chosen != null || Q.done) return;
  const q = Q.qs[Q.i], ok = k === q.answer;
  sfx(ok ? 'rep' : 'miss');
  if (!ok) buzz();
  streak(ok);
  grade(Q.m, q.item, ok, new Date());
  saveCards(Q.m);
  Q.chosen = k; Q.ok.push(ok);
  renderQuiz(true);
}
function quizNext() {
  if (Q.i < Q.qs.length - 1) { Q.i++; Q.chosen = null; renderQuiz(); return; }
  Q.done = true;
  const share = Q.ok.filter(Boolean).length / Q.qs.length;
  if (share >= 0.8) say('good'); else if (share < 0.5) say('bad');
  renderQuiz();
}
function renderResults() {
  const n = Q.ok.filter(Boolean).length;
  setBar('Підсумок');
  const miss = Q.qs.map((q, i) => Q.ok[i] ? '' : `<div><p>${esc(q.prompt)}</p><p>${esc(q.options[q.answer])}</p></div>`).join('');
  app.innerHTML = `
    <div><p class="score">${n} / ${Q.qs.length}</p><p class="muted center">правильних відповідей</p></div>

  window.scrollTo(0, 0);
}

// — Озвучка кроків: один аудіоелемент на всі кроки (так iPhone дозволяє грати кроки підряд) —
const VOICE_STEPS = { dis: DIS.length, as: ASM.length, law: 9, safe: 5, codex: 6 };
const VOICE_NAME = { dis: 'Розбирання · крок', as: 'Збирання · крок', law: 'Застосування зброї · частина', safe: 'Безпечне поводження · правило', codex: 'Кодекс · пункт' };
const stepAudio = new Audio();
stepAudio.preload = 'auto';
const P = { kind: null, n: 0, all: false, wait: null, token: 0 };
function markStep(n, on) {
  const el = app.querySelector(`[data-step="${n}"]`);
  if (!el) return null;
  el.classList.toggle('playing', on);
  const b = el.querySelector('.play');
  if (b) { b.innerHTML = svg(on ? 'stop' : 'play'); b.setAttribute('aria-label', `${on ? 'Зупинити' : 'Слухати'} крок ${n}`); }
  return el;
}
function paintListen() {
  const b = $('listen');
  if (b) b.innerHTML = `${svg(P.all ? 'stop' : 'phones')}<span>${P.all ? 'Зупинити' : 'Слухати все'}</span>`;
}
function stopSteps() {
  P.token++;
  clearTimeout(P.wait);
  try { stepAudio.pause(); } catch (e) { /* немає звуку */ }
  if (P.n) markStep(P.n, false);
  P.kind = null; P.n = 0; P.all = false;
  $('player').hidden = true;
  paintListen();
}
function playStep(kind, n, all) {
  stopSteps();
  if (audio) audio.pause();
  hideSgt();
  const tok = ++P.token;
  P.kind = kind; P.n = n; P.all = all;
  const el = markStep(n, true);
  if (el) {
    // Рядок поточного кроку ставимо одразу під моделлю — щоб поруч були текст і фото саме цього кроку
    const stick = app.querySelector('.m3d-stick');
    if (stick) window.scrollTo({ top: window.scrollY + el.getBoundingClientRect().top - stick.getBoundingClientRect().bottom - 4, behavior: 'smooth' });
    else el.scrollIntoView({ block: all ? 'center' : 'nearest', behavior: 'smooth' });
  }
  if (kind === 'dis' || kind === 'as') { modelStep(n, kind); gStep = n; modelPos(); }
  $('player-text').textContent = `${VOICE_NAME[kind]} ${n} з ${VOICE_STEPS[kind]}`;
  $('player').hidden = false;
  paintListen();
  stepAudio.onended = () => {
    if (tok !== P.token) return;
    markStep(n, false);
    if (P.all && n < VOICE_STEPS[kind]) P.wait = setTimeout(() => { if (tok === P.token) playStep(kind, n + 1, true); }, 500);
    else stopSteps();
  };
  stepAudio.src = `voice/${kind}_${pad(n)}.mp3`;
  try {
    const p = stepAudio.play();
    if (p && p.catch) p.catch(() => { if (tok === P.token) stopSteps(); });
  } catch (e) { stopSteps(); }
}

// — Збереження прогресу: резервний код —
function exportCode() {
  const c = {};
  for (const [k, v] of Object.entries(loadCards())) c[k] = [v.b, v.d];
  const b = {};
  for (const key of ['dis', 'as']) { const v = getBest(key); if (v != null) b[key] = v; }
  return 'UAR1.' + btoa(JSON.stringify({ c, b }));
}
function parseCode(s) {
  s = String(s || '').replace(/\s+/g, '');
  if (!s.startsWith('UAR1.')) return null;
  try {
    const o = JSON.parse(atob(s.slice(5)));
    const cards = {}, best = {};
    for (const [k, v] of Object.entries(o.c || {})) {
      if (ITEMS.includes(k) && Array.isArray(v) && Number.isInteger(v[0]) && v[0] >= 0 && v[0] <= 3 && /^\d{4}-\d{2}-\d{2}$/.test(v[1])) cards[k] = { b: v[0], d: v[1] };
    }
    for (const key of ['dis', 'as']) { const v = o.b && o.b[key]; if (Number.isInteger(v) && v >= 0 && v < 86400) best[key] = v; }
    return { cards, best };
  } catch (e) { return null; }
}

  const t = progress(pending.cards, 'f:'), p = progress(pending.cards, 'p:');
  const b = k => pending.best[k] != null ? fmt(pending.best[k]) : '—';
  $('restore-msg').textContent = `У коді: ТТХ ${t}%, будова ${p}%, рекорди: розбирання ${b('dis')}, збирання ${b('as')}. Замінити прогрес на цьому телефоні?`;
  $('restore-confirm').hidden = false;
}
function backupApply() {
  if (!pending) return;
  saveCards(pending.cards);
  for (const [k, v] of Object.entries(pending.best)) { memBest[k] = v; store.set(K_BEST + k, String(v)); }
  pending = null;

}

// — Розбирання / збирання на час —
let D = null, drillTick = null;
function drill(assembly) {
  const steps = assembly ? ASM : DIS;
  D = { assembly, key: assembly ? 'as' : 'dis', steps, pool: shuffle([...steps]), done: 0, mistakes: 0, wrong: null, t0: performance.now(), sec: 0, finished: false };
  D.best = getBest(D.key);
  clearInterval(drillTick);
  drillTick = setInterval(() => {
    if (!D || D.finished) return;
    D.sec = Math.floor((performance.now() - D.t0) / 1000);
    const t = $('timer'); if (t) t.textContent = fmt(D.sec);
  }, 250);
  app.innerHTML = `${stickModel(assembly ? 'as' : 'dis')}<div class="col" id="dbody"></div>`;
  renderDrill();
  window.scrollTo(0, 0);
}
function renderDrill() {
  const fin = D.finished;
  setBar(D.assembly ? 'Збирання' : 'Неповне розбирання');
  const done = D.steps.slice(0, D.done).map((s, i) => {
    const p = D.assembly ? null : picFor(s);
    return `<li class="step ok"><b>${i + 1}.</b><div><span>${esc(s)}</span>${p ? zimg(stepImg(p), true, 'thumb', `Малюнок ${p}: ${s}`) : ''}</div></li>`;
  }).join('');
  $('dbody').innerHTML = `
    <div class="drill-head"><span class="timer" id="timer" role="timer">${fmt(D.sec)}</span>
      <span class="${D.mistakes ? 'bad-t' : 'muted'}">помилок: ${D.mistakes}</span></div>
    ${D.best != null ? `<p class="muted small" style="margin-top:-8px">найкраще без помилок: ${fmt(D.best)}</p>` : ''}
    ${D.done ? `<ol class="steps">${done}</ol>` : ''}
    ${!fin ? `
      <h3 class="h">Крок ${D.done + 1} з ${D.steps.length} — що далі?</h3>
      <div class="pool">${D.pool.map((s, i) => `<button class="pick${s === D.wrong ? ' wrong' : ''}" data-act="pick" data-i="${i}">${esc(s)}</button>`).join('')}</div>`
    : `
      <p class="verdict">${D.mistakes === 0 ? `Без помилок за ${fmt(D.sec)}.` : `Готово за ${fmt(D.sec)}, помилок: ${D.mistakes}. Ще раз — без помилок.`}</p>
      <button class="btn primary" data-act="drill-again">Ще раз</button>`}
    <p class="src">Джерело: ${D.assembly ? `${esc(SRC_AS)}. Звір з інструктором.` : `${esc(SRC_DIS)}.`}</p>`;
}
function pickStep(i) {
  if (!D || D.finished) return;
  const s = D.pool[i];
  if (s === undefined) return;
  if (s === D.steps[D.done]) {
    D.pool.splice(i, 1); D.done++; D.wrong = null;
    modelStep(D.done, D.assembly ? 'as' : 'dis');
    sfx(D.done === D.steps.length ? 'goal' : 'click');
    if (D.done === D.steps.length) {
      D.finished = true;
      D.sec = Math.floor((performance.now() - D.t0) / 1000);
      clearInterval(drillTick);
      if (D.mistakes === 0) { setBest(D.key, D.sec); D.best = getBest(D.key); }
      say(D.mistakes === 0 ? 'good' : 'bad');
    }
  } else {
    D.mistakes++; D.wrong = s; sfx('miss'); buzz();
  }
  renderDrill();
}

const Z = { el: $('zoom'), stage: $('zoom-stage'), img: $('zoom-img'), s: 1, tx: 0, ty: 0, ptrs: new Map(), g: null, tap: null, opener: null };
function zClamp() {

  Z.tx = Math.min(0, Math.max(W - W * Z.s, Z.tx));

  Z.s = 1; Z.tx = 0; Z.ty = 0; Z.ptrs.clear(); Z.g = null;
  Z.el.hidden = false;

}
function closeZoom() {

}

    Z.g = { pinch: true, d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: Z.s, cx: (mid.x - Z.tx) / Z.s, cy: (mid.y - Z.ty) / Z.s };

    if (n / L.qs.length >= 0.8) say('good'); else if (n / L.qs.length < 0.5) say('bad');

      <button class="btn primary" data-act="law-again">Ще раз</button>

    window.scrollTo(0, 0); return;

  setBar(`Перевірка · ${L.i + 1} / ${L.qs.length}`);
  const cls = k => !answered ? '' : k === q.answer ? ' right' : k === L.chosen ? ' wrong' : '';

let cleanCur = 0;

  try { f.contentWindow.postMessage({ type: 'uar-clean', n }, location.origin); } catch (e) { /* модель ще вантажиться */ }
  document.querySelectorAll('.cl-steps li').forEach(li => li.classList.toggle('on', li === row));
}
function cleanView() {

const ROUTES = {
  '': home, ttx: cards, table, parts,
  test: () => quiz(false), review: () => quiz(true), guide, 'guide-as': guideAs,
  'drill-dis': () => drill(false), 'drill-as': () => drill(true), save: saveView, model: modelView, aim: aimView, clean: cleanView, safe: safeView, law: lawView, 'law-test': lawTest,
};
function route() {
  closeZoom();
  stopSteps();
  modelWant = 0;
  clearInterval(drillTick); D = null;
  const h = decodeURIComponent(location.hash.slice(1));
  view = Object.prototype.hasOwnProperty.call(ROUTES, h) ? h : '';
  ROUTES[view]();
  window.scrollTo(0, 0);
}
function go(to) {
  if ((location.hash.slice(1) || '') === to) { route(); return; }
  location.hash = to;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  switch (t.dataset.act) {
    case 'go': go(t.dataset.to); break;
    case 'zoom': openZoom(t.dataset.src, t.dataset.photo === '1', t); break;
    case 'zoom-close': closeZoom(); break;
    case 'zoom-in': zAt(Z.stage.clientWidth / 2, Z.stage.clientHeight / 2, Z.s * 1.6); break;
    case 'zoom-out': zAt(Z.stage.clientWidth / 2, Z.stage.clientHeight / 2, Z.s / 1.6); break;
    case 'flip':
      if (swiped) { swiped = false; break; }
      flipCard(); break;
    case 'card-prev': cardGo(-1); break;
    case 'card-next': cardGo(1); break;
    case 'opt': answer(parseInt(t.dataset.k, 10)); break;
    case 'aim-set': { const k = t.dataset.k, v = t.dataset.v; AIM_ST[k] = k === 'dist' ? +v : k === 'hint' ? v === 'true' : v; AIM_ST.last = null; AIM_ST.shots = AIM_ST.hits = 0; if (k === 'mode') AIM_ST.drill = null; aimControls(); aimInfo(); aimSync(); break; }
    case 'clean-show': cleanShow(+t.dataset.n, t); break;
    case 'aim-fire': aimSend({ fire: true }); break;
    case 'law-opt': lawAnswer(parseInt(t.dataset.k, 10)); break;
    case 'law-next': L.i++; L.chosen = null; lawRender(); window.scrollTo(0, 0); break;
    case 'law-again': lawTest(); window.scrollTo(0, 0); break;
    case 'quiz-next': quizNext(); break;
    case 'quiz-again': quiz(Q ? Q.review : false); break;
    case 'pick': pickStep(parseInt(t.dataset.i, 10)); break;
    case 'drill-again': drill(D ? D.assembly : false); break;
    case 'sgt-close': hideSgt(); break;
    case 'listen-all': P.all ? stopSteps() : playStep(t.dataset.kind, 1, true); break;
    case 'play-step': {
      const n = parseInt(t.dataset.n, 10);
      if (P.n === n && P.kind === t.dataset.kind) stopSteps(); else playStep(t.dataset.kind, n, P.all);
      break;
    }
    case 'player-stop': stopSteps(); break;
    case 'model-next': if (gStep < VOICE_STEPS[t.dataset.kind]) playStep(t.dataset.kind, gStep + 1, false); break;
    case 'model-prev':
      if (gStep > 1) playStep(t.dataset.kind, gStep - 1, false);
      else { stopSteps(); gStep = 0; modelPos(); modelStep(parseInt(t.dataset.n, 10)); }
      break;
    case 'parts-set': partsSetTo(t.dataset.set); break;
    case 'pick-part': { const n = parseInt(t.dataset.n, 10); markPart(n); try { $('m3d').contentWindow.postMessage({ type: 'uar-pick', num: n }, location.origin); } catch (e) { /* модель ще вантажиться */ } break; }
    case 'backup-copy': backupCopy(); break;
    case 'backup-check': backupCheck(); break;
    case 'backup-apply': backupApply(); break;
    case 'backup-cancel': pending = null; $('restore-confirm').hidden = true; break;
    case 'theme':
      theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
      try { if (theme === 'auto') localStorage.removeItem(K_THEME); else localStorage.setItem(K_THEME, theme); } catch (e) { /* без сховища */ }
      applyTheme(); sfx('click'); break;
    case 'voice':
      voiceOn = !voiceOn; store.set(K_VOICE, voiceOn ? '1' : '0'); paintVoice();
      if (!voiceOn && audio) audio.pause();
      break;
  }
});
document.addEventListener('keydown', e => {
  if (!Z.el.hidden) {
    if (e.key === 'Escape') closeZoom();
    else if (e.key === '+' || e.key === '=') zAt(Z.stage.clientWidth / 2, Z.stage.clientHeight / 2, Z.s * 1.6);
    else if (e.key === '-') zAt(Z.stage.clientWidth / 2, Z.stage.clientHeight / 2, Z.s / 1.6);
    return;
  }
  if (view === 'ttx' && !e.altKey && !e.ctrlKey && !e.metaKey) {
    if (e.key === 'ArrowRight') cardGo(1);
    else if (e.key === 'ArrowLeft') cardGo(-1);
  }
});
window.addEventListener('hashchange', route);
document.addEventListener('load', e => { if (e.target && e.target.id === 'm3d' && (modelWant || modelKind === 'as') && /embed=steps/.test(e.target.src)) setTimeout(() => modelStep(modelWant), 400); }, true);

applyTheme();
paintVoice();
route();

// ── Автооновлення: сторінка сама перевіряє, чи вийшла нова версія сайту ──
let updWarned = false;
async function checkUpdate() {
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const { v, note } = await r.json();
    if (!v || v === APP_V) return;
    // На головному екрані оновлюємо одразу; посеред тесту чи тренування — питаємо
    if (view === '' || view === 'law' || view === 'table') { location.reload(); return; }
    if (updWarned) return; updWarned = true;
    const b = document.createElement('button');
    b.className = 'upd'; b.innerHTML = '<b></b><span>Торкнись, щоб оновити</span>';
    b.querySelector('b').textContent = note ? 'Оновлення: ' + note : 'Вийшло оновлення';
    b.onclick = () => location.reload();
    document.body.appendChild(b);
  } catch (e) { /* немає мережі — спробуємо пізніше */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
window.addEventListener('focus', checkUpdate);
window.addEventListener('pageshow', checkUpdate);
setInterval(checkUpdate, 5 * 60 * 1000);
setTimeout(checkUpdate, 3000);
// Після оновлення один раз показуємо, що змінилось (тільки тим, хто вже заходив раніше)
(async () => {
  try {
    let seen = null; try { seen = localStorage.getItem('uar15_seen_v'); } catch (e) {}
    if (seen === APP_V) return;
    try { localStorage.setItem('uar15_seen_v', APP_V); } catch (e) {}
    if (!seen) return;
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const { v, note } = await r.json();
    if (v !== APP_V || !note || document.querySelector('.upd')) return;
    const b = document.createElement('button');
    b.className = 'upd done'; b.innerHTML = '<b></b><span>Торкнись, щоб закрити</span>';
    b.querySelector('b').textContent = 'Оновлено: ' + note;
    b.onclick = () => b.remove(); document.body.appendChild(b); setTimeout(() => b.remove(), 10000);
  } catch (e) {}
})();
window.__uar = { FACTS, PARTS, ON_DIAGRAM, DIS, ASM, ITEMS, question, grade, dueItems, pickItems, progress, picFor, exportCode, parseCode };
})();
